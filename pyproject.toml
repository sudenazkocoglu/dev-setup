[project]
name = "dev-setup"
version = "0.1.0"
description = "Standart Python proje şablonu ve DevOps geliştirme ortamı"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
dev-setup = "dev_setup.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]

line-length = 88


target-version = "py312"

[tool.mypy]
python_version = "3.12"

warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
